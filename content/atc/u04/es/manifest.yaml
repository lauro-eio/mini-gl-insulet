locale: es
program_title: Hábitos operativos y ejecución
lens_title: Bucles de responsabilidad del equipo
article_signature: "Curaduría de {E}"
unit_goal: >
  Ayudar a los supervisores de primera línea a notar las claves que disparan los
  hábitos del equipo, calificar qué hábitos del piso ayudan o dañan el desempeño, y
  rediseñar el entorno físico y social para que los buenos hábitos se sostengan sin
  depender solo de la fuerza de voluntad.
banned_phrases:
  - fabricated
  - mock metric
  - Atomic Habits
  - Habit Hacking for Breakthrough
  - In our modern age
  - In a fast-paced world
  - Hábitos Atómicos
