audience_id: tier_2_frontline_leader
locale: en
program_title: Cognitive Anchors & Deliberation
lens_title: Analytical Deliberation
article_signature: "Curated by {E}"
unit_goal: >
  Help frontline leaders notice how a safety, quality, or scheduling call is framed
  before they act on it, and deliberately check that frame against the facts when
  emotion, loss language, or a vivid recent incident may be driving the decision.
banned_phrases:
  - fabricated
  - mock metric
  - Thinking, Fast and Slow
  - Thinking Fast and Slow
  - Atomic Habits
  - In our modern age
  - In a fast-paced world
word_budgets:
  research_article: { max: 900, soft_max: 750 }
  opinion_article: { max: 550, soft_max: 450 }
  key_notes: { max: 400, soft_max: 350 }
  self_assessment: { max: 900, soft_max: 800 }
  case_study: { max: 700, soft_max: 600 }
  framework_tool: { max: 450, soft_max: 400 }
  commitment_plan: { max: 350, soft_max: 300 }
  live_roleplay_1v1: { max: 450, soft_max: 400 }
  live_roleplay_strategic: { max: 450, soft_max: 400 }
