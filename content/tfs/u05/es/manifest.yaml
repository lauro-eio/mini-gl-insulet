locale: es
program_title: Anclaje cognitivo y deliberación
lens_title: Deliberación analítica
article_signature: "Curaduría de {E}"
unit_goal: >
  Ayudar a los líderes de primera línea a notar cómo está encuadrada una decisión
  de seguridad, calidad o programación antes de actuar sobre ella, y a verificar
  deliberadamente ese encuadre contra los hechos cuando la emoción, el lenguaje
  de pérdida o un incidente reciente y vívido puedan estar impulsando la decisión.
banned_phrases:
  - fabricated
  - mock metric
  - Thinking, Fast and Slow
  - Thinking Fast and Slow
  - Atomic Habits
  - In our modern age
  - In a fast-paced world
  - Pensar rápido, pensar despacio
  - Hábitos Atómicos
