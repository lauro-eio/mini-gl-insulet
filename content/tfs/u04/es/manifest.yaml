unit_goal: >
  Ayudar a los líderes de primera línea a reconocer cuándo una historia
  coherente construida después de los hechos está reemplazando en silencio lo
  que el registro y el momento realmente mostraron, y a proteger un ritual de
  cierre de turno basado en hechos frente a la retrospectiva y los atajos de
  memoria.
