unit_goal: >
  Ayudar a los líderes de primera línea a leer los números de piso sin confiar
  demasiado en muestras pequeñas, esperar la regresión después de un valor atípico,
  sopesar las tasas base frente a historias causales prolijas, y preferir una
  regla simple y verificada por encima de la narrativa instintiva en las
  decisiones que se repiten.
