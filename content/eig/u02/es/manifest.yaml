program_id: EIG
unit_id: u02
audience_id: tier_2_frontline_leader
locale: es
program_title: Resiliencia y resonancia emocional
lens_title: Liderazgo empático de equipos
article_signature: "Curaduría de {E}"
unit_goal: >
  Ayudar a los líderes de primera línea a reconocer un secuestro activo en
  tiempo real —no solo el impulso que lo precede— y a usar una breve
  interrupción para recuperar el juicio deliberado antes de que una decisión
  de piso fije la respuesta equivocada.
