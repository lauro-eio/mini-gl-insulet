locale: es
program_title: Resiliencia y resonancia emocional
lens_title: Liderazgo empático de equipos
article_signature: "Curaduría de {E}"
unit_goal: >
  Ayudar a los líderes de primera línea a convertir una lectura rápida del tono o
  las palabras de un compañero en una lectura verificada—mediante una breve
  pausa de reflejo y verificación—para que las decisiones en el piso registren lo
  que realmente está pasando, no solo lo que es más rápido de asumir.
