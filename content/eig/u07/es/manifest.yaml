program_id: EIG
unit_id: u07
audience_id: tier_2_frontline_leader
locale: es
program_title: Resiliencia y resonancia emocional
lens_title: Liderazgo empático de equipos
article_signature: "Curaduría de {E}"
unit_goal: >
  Ayudar a los líderes de primera línea a integrar las habilidades de
  alfabetización emocional del equipo—notar un pico, nombrarlo, elegir una
  respuesta—en tres puntos de contacto que superan un solo taller: la
  inducción de nuevos integrantes, el coaching en el huddle previo al turno,
  y los check-ins entre pares después de un incidente.
