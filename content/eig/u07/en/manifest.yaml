unit_goal: >
  Help frontline leaders embed the team's emotional-literacy skills—noticing a
  surge, naming it, choosing a response—into three touchpoints that outlast a
  single workshop: new-hire onboarding, pre-shift huddle coaching, and peer
  check-ins after an incident.
