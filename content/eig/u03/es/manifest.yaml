  - mock metric
  - Emotional Intelligence
  - Emotional Resilience Accelerator
  - Atomic Habits
  - Thinking Fast and Slow
  - Thinking, Fast and Slow
  - In our modern age
  - In a fast-paced world
  - Inteligencia emocional
  - Hábitos Atómicos
  - Pensar rápido, pensar despacio
