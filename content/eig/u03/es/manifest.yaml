locale: es
program_title: Resiliencia y resonancia emocional
lens_title: Liderazgo empático de equipos
article_signature: "Curaduría de {E}"
unit_goal: >
  Ayudar a los líderes de primera línea a nombrar con precisión su propio
  estado emocional antes y durante una conversación de coaching, para que la
  retroalimentación se mantenga centrada en el desempeño del colaborador
  directo—no en la reacción no examinada del líder.
